dataset:
  category: ml-1m
  data_dir: data/raw
  max_seq_len: 50
  min_interactions: 5
model:
  base_model_type: mf
  bidirectional: false
  d_state: 16
  dropout: 0.2
  emb_dim: 64
  enc_n_heads: 4
  encoder_type: gru
  hidden_dim: 128
  mlp_layers:
  - 256
  - 128
  - 64
  n_blocks: 2
  n_heads: 2
  n_layers: 2
training:
  batch_size: 256
  checkpoint_path: checkpoints/stateful_best.pt
  k_list:
  - 5
  - 10
  - 20
  log_dir: runs/stateful
  lr: 0.0005
  monitor: HR@10
  n_epochs: 50
  n_neg_candidates: 100
  patience: 10
  warmup_steps: 200
  weight_decay: 1.0e-05
